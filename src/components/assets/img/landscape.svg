<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 100">

  <!-- Grande montagne fond beige (droite, large, graduelle) -->
  <path fill="#e8e1d7" d="M 0,100 C 50,100 170,6 240,4 C 300,4 370,50 400,100 Z"/>

  <!-- Vert foncé : bord droit, fine bande -->
  <path fill="#5d8a10" d="M 320,100 C 345,60 378,20 400,26 L 400,100 Z"/>

  <!-- Montagne rouge : pic gauche principal (reproduit la forme de la photo) -->
  <path fill="#bd3018" d="M -10,100 C 10,90 75,10 130,6 C 165,10 215,62 265,100 Z"/>

  <!-- Orange : face gauche de la rouge, même pic légèrement décalé -->
  <path fill="#d45514" d="M -10,100 C 5,90 50,20 100,14 C 130,20 180,75 225,100 Z"/>

  <!-- Jaune : colline douce à droite -->
  <path fill="#e6a934" d="M 255,100 C 290,88 338,46 360,40 C 378,46 400,72 410,100 Z"/>

  <!-- Vert vif : colline basse centre-gauche -->
  <path fill="#95c11f" d="M -10,100 C 15,98 55,60 85,54 C 108,60 155,88 200,100 Z"/>

  <!-- Brun rouge : cluster avant-gauche, face très pentue -->
  <path fill="#7f2010" d="M -10,100 C 2,98 28,68 45,62 C 58,68 92,94 125,100 Z"/>

  <!-- Très sombre : coin bas gauche -->
  <path fill="#5d161a" d="M -10,100 C 0,100 14,84 22,80 C 30,84 52,100 68,100 Z"/>

  <!-- Soleil -->
  <circle fill="#bd3018" cx="358" cy="14" r="9"/>

</svg>
