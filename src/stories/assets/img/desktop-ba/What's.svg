<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="331" height="164" viewBox="0 0 331 164">
  <defs>
    <style>
      .cls-1 {
        fill: #e6a934;
        font-size: 100px;
        font-family: Sutturah-Fat, Sutturah Fat;
        font-weight: 900;
        letter-spacing: 0.005em;
        opacity: 0.36;
      }

      .cls-2 {
        filter: url(#What_s);
      }
    </style>
    <filter id="What_s" x="0" y="0" width="331" height="164" filterUnits="userSpaceOnUse">
