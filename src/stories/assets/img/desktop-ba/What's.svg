  <g class="cls-2" transform="matrix(1, 0, 0, 1, 0, 0)">
    <text id="What_s-2" data-name="What&apos;s" class="cls-1" transform="translate(4 117)"><tspan x="0" y="0">What&apos;s</tspan></text>
